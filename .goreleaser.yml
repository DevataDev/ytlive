version: 2
before:
  hooks:
    - go generate
    - go mod download

builds:
  - id: ytlive
    env:
      - CGO_ENABLED=1
    goos:
      - linux
      - freebsd
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - mips64
    ldflags:
      - "-X windsorf-youtube-live/internal/version.Version={{.Version}}"
      - "-X windsorf-youtube-live/internal/version.Commit={{.Commit}}"
      - "-X windsorf-youtube-live/internal/version.Date={{.Date}}"
    overrides:
      - goos: windows
        goarch: amd64
        env:
          - CC=x86_64-w64-mingw32-gcc
          - CXX=x86_64-w64-mingw32-g++
          - CGO_ENABLED=1
        ldflags:
          - -s -w -extldflags "-static"

      - goos: windows
        goarch: '386'
        env:
          - CC=i686-w64-mingw32-gcc
          - CXX=i686-w64-mingw32-g++
          - CGO_ENABLED=1
        ldflags:
          - -s -w -extldflags "-static"
      
      - goos: linux
        goarch: arm64
        env:
          - CC=aarch64-linux-gnu-gcc
          - CXX=aarch64-linux-gnu-g++
          - CGO_ENABLED=1
        ldflags:
          - -s -w -extldflags "-static"
      
      - goos: linux
        goarch: mips64
        env:
          - CC=mips64-linux-gnu-gcc
          - CXX=mips64-linux-gnu-g++
          - CGO_ENABLED=1
        ldflags:
          - -s -w -extldflags "-static"
      
      - goos: linux
        goarch: mips64le
        env:
          - CC=mips64le-linux-gnu-gcc
          - CXX=mips64le-linux-gnu-g++
          - CGO_ENABLED=1
        ldflags:
          - -s -w -extldflags "-static"

changelog:
  sort: asc
  use: github
  format: "{{ .SHA }}: {{ .Message }} (@{{ . }}){{ end }}"
  filters:
    exclude:
      - "^test:"
      - "^test\\("
      - "^chore: update$"
      - "^chore: docs$"
      - "^docs: update$"
      - "^chore: schema$"
      - "^chore: typo$"
      - "^chore: auto-update generated files$"
      - "^chore: update schema$"
      - "^chore: schema update$"
      - "^chore\\(deps\\): "
      - "^(build|ci): "
      - "merge conflict"
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
      - go mod tidy
  groups:
    - title: "New Features"
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 100
    - title: "Security updates"
      regexp: '^.*?sec(\(.+\))??!?:.+$'
      order: 150
    - title: "Bug fixes"
      regexp: '^.*?(fix|refactor)(\(.+\))??!?:.+$'
      order: 200
    - title: "Documentation updates"
      regexp: ^.*?docs?(\(.+\))??!?:.+$
      order: 400
    - title: Other work
      order: 9999

nfpms:
  - id: ytlive
    package_name: ytlive
    file_name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    vendor: YukLive
    homepage: https://yuklive.my.id
    maintainer: YukLive <yuklive@yuklive.my.id>
    description: YukLive is an utility to easier process TikTok and YouTube live streaming.
    license: MIT
    section: utils
    priority: extra
    ids:
      - ytlive

    formats:
      - deb
      - rpm