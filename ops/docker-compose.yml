services:
  # Traefik reverse proxy with automatic HTTPS
  traefik:
    image: traefik:v3.0
    container_name: ops-traefik
    command:
      - --api.dashboard=true
      - --api.insecure=true 
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"       
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - ops-net
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    container_name: ops-postgres
    environment:
      POSTGRES_DB: ops
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - ops_postgres_data:/var/lib/postgresql/data
    networks:
      - ops-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ops-backend
    environment:
      # Example DSN: host=db user=ops password=changeme dbname=ops port=5432 sslmode=disable
      POSTGRES_DSN: "${POSTGRES_DSN:-host=db user=ops password=${POSTGRES_PASSWORD:-changeme} dbname=ops port=5432 sslmode=disable}"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-supersecretkey}
      OPS_BACKEND_URL: ${OPS_BACKEND_URL:-http://localhost:8080}
      GIN_MODE: release
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3100}
    depends_on:
      - db
    networks:
      - ops-net
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ops-backend.rule=Host(`${API_DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.ops-backend.entrypoints=websecure"
      - "traefik.http.routers.ops-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.ops-backend.loadbalancer.server.port=8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_OPS_BACKEND_URL=${OPS_BACKEND_URL:-http://localhost:8080}
    container_name: ops-frontend
    environment:
      NEXT_PUBLIC_OPS_BACKEND_URL: ${OPS_BACKEND_URL:-http://localhost:8080}
      NODE_ENV: production
    depends_on:
      - backend
    ports: []
    networks:
      - ops-net
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ops-frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.ops-frontend.entrypoints=websecure"
      - "traefik.http.routers.ops-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.ops-frontend.loadbalancer.server.port=3100"

  createsuper:
    image: golang:1.24-alpine
    profiles: ["utility"]        # won’t start with `up` by default
    working_dir: /src
    volumes:
      - ./backend:/src
    networks:
      - ops-net
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

volumes:
  ops_postgres_data:
  traefik_letsencrypt:

networks:
  ops-net:
    driver: bridge
