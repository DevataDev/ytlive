<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Live Stream Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
</head>
<body>
<header class="sticky-top bg-white border-bottom shadow-sm mb-4">
    <div class="container-fluid d-flex justify-content-between align-items-center py-2">
        <span class="fw-bold fs-4">YukLive!</span>
        <button id="logoutBtn" class="btn btn-outline-secondary" style="display:none;">Logout</button>
    </div>
</header>
<div class="container py-5">
    <!-- Login Form -->
    <div id="loginSection" class="mb-4">
        <h4>Login</h4>
        <div class="mb-3">
            <label for="loginEmail" class="form-label">Email</label>
            <input type="email" class="form-control" id="loginEmail" placeholder="Enter email" required>
        </div>
        <div class="mb-3">
            <label for="loginPassword" class="form-label">Password</label>
            <div class="input-group">
                <input type="password" class="form-control" id="loginPassword" placeholder="Enter password" required>
                <button class="btn btn-outline-secondary toggle-password" type="button" tabindex="-1"><i class="fa fa-eye"></i></button>
            </div>
        </div>
        <button id="loginBtn" class="btn btn-primary">Login</button>
        <div id="loginStatus" class="mt-2"></div>
    </div>
</div>
<footer class="text-center text-muted py-3" id="footer"></footer>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="/static/js/app.js"></script>
<script>
const sinceYear = 2025;
const nowYear = new Date().getFullYear();
let yearStr = sinceYear === nowYear ? `${sinceYear}` : `${sinceYear} - ${nowYear}`;
document.getElementById('footer').innerHTML = `&copy; ${yearStr} Yuk Live! By PT Jejaring Internet Bersama`;
</script>
</body>
</html>
