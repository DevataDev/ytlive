<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Video | YukLive!</title>
    <meta name="description" content="YukLive! Upload Video">
    <meta name="author" content="YukLive!">
    <meta name="keywords" content="YukLive!, Stream Manager, YouTube Live, Live Stream, Live Streaming, Streaming">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="shortcut icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header class="sticky-top bg-white border-bottom shadow-sm mb-4">
    <nav class="navbar navbar-expand-lg bg-white">
        <div class="container-fluid">
            <span class="fw-bold fs-4 me-3">YukLive!</span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a href="/dashboard" class="nav-link">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a href="/stream" class="nav-link">Stream</a>
                    </li>
                </ul>
                <button id="logoutBtn" class="btn btn-outline-secondary ms-lg-2">Logout</button>
            </div>
        </div>
    </nav>
</header>
<div class="container dashboard-container">
    <h2 class="mb-4">Upload or Register Video</h2>
    <div class="card p-4">
        <form id="uploadForm">
            <div class="mb-3">
                <label for="videoFile" class="form-label">Upload Video File</label>
                <input class="form-control" type="file" id="videoFile" name="videoFile" accept="video/*">
            </div>
            <div class="mb-3 text-center">OR</div>
            <div class="mb-3">
                <label for="driveLink" class="form-label">Google Drive Link</label>
                <input class="form-control" type="url" id="driveLink" name="driveLink" placeholder="https://drive.google.com/...">
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
            <a href="/stream" class="btn btn-secondary ms-2">Cancel</a>
        </form>
        <div id="uploadStatus" class="mt-3"></div>
    </div>
</div>
<footer class="text-center text-muted py-3" id="footer"></footer>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="/static/js/upload.js?v=0.2.5"></script>
<script>
const sinceYear = 2025;
const nowYear = new Date().getFullYear();
let yearStr = sinceYear === nowYear ? `${sinceYear}` : `${sinceYear} - ${nowYear}`;
document.getElementById('footer').innerHTML = `&copy; ${yearStr} Yuk Live! By PT Jejaring Internet Bersama`;
</script>
</body>
</html>
