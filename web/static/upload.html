    <script>
    // Initialize header active state
    function setActiveNavItem() {
        const currentPath = window.location.pathname;
        const navLinks = document.querySelectorAll('.nav-link, .dropdown-item');
        
        navLinks.forEach(link => {
            if (link.getAttribute('href') === currentPath) {
                link.classList.add('active');
                // If it's a dropdown item, also activate its parent dropdown
                const dropdownItem = link.closest('.dropdown-item');
                if (dropdownItem) {
                    const parentDropdown = link.closest('.dropdown');
                    if (parentDropdown) {
                        parentDropdown.querySelector('.nav-link').classList.add('active');
                    }
                }
            }
        });
    }

    // Initialize when DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
        setActiveNavItem();
        
        // Handle logout
        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', function() {
                // Add your logout logic here
                window.location.href = '/logout';
            });
        }
    });
    </script>

<style>
@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}

.footer {
    background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    opacity: 0;
    animation: fadeInUp 0.6s ease-out forwards;
}
.footer:hover {
    background: linear-gradient(135deg, #f1f3f5 0%, #f8f9fa 100%);
    box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
}
.vr {
    width: 1px;
    height: 1.5rem;
    background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.1), transparent);
    opacity: 0.7;
    transition: all 0.3s ease;
}
.broadcast-icon {
    transition: all 0.3s ease;
    display: inline-block;
}
.broadcast-icon:hover {
    animation: pulse 1.5s infinite;
    color: #0d6efd !important;
}
.brand-text {
    color: #6c757d;
    font-weight: 500;
    transition: all 0.3s ease;
    position: relative;
}
.brand-text::after {
    content: '';
    position: absolute;
    width: 0;
    height: 2px;
    bottom: -2px;
    left: 0;
    background-color: #0d6efd;
    transition: width 0.3s ease;
}
.brand-text:hover::after {
    width: 100%;
}
.version-badge {
    display: inline-block;
    padding: 0.3rem 0.7rem;
    font-size: 0.75rem;
    font-weight: 600;
    line-height: 1;
    color: #fff;
    background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
    border-radius: 50rem;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
}
.version-badge::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    transition: 0.5s;
}
.version-badge:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
}
.version-badge:hover::before {
    left: 100%;
}
.copyright-text {
    color: #6c757d;
    font-size: 0.85rem;
    transition: all 0.3s ease;
}
.copyright-text:hover {
    color: #495057;
    text-shadow: 0 0 1px rgba(0, 0, 0, 0.1);
}
@media (max-width: 767.98px) {
    .footer {
        text-align: center;
    }
    .vr {
        display: none !important;
    }
}
</style>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
const sinceYear = 2025;
const nowYear = new Date().getFullYear();
let yearStr = sinceYear === nowYear ? `${sinceYear}` : `${sinceYear} - ${nowYear}`;

function loadScript(version = '0.4.3') {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = `/static/js/upload-new.js?v=${version}`;
    script.onload = () => resolve();
    script.onerror = (err) => reject(err);
    document.body.appendChild(script);
  });
}

// Set current year in footer
document.getElementById('currentYear').textContent = new Date().getFullYear();

// Set up the version info and load the script
fetch('/api/version')
  .then(res => res.json())
  .then(data => {
    if (data.version && data.commit) {
      const versionInfo = document.getElementById('versionInfo');
      versionInfo.textContent = `v${data.version} (${data.commit.slice(0,7)})`;
      versionInfo.title = `Build: ${data.commit}\nDate: ${new Date(data.buildTime).toLocaleString()}`;
    }
    return loadScript(data.version || '0.4.3');
  })
  .catch((err) => {
    console.error("Error initializing app:", err);
    return loadScript('0.4.3');
  })
  .finally(() => {
    // Initialize the app after everything is loaded
    if (typeof initApp === 'function') {
      initApp();
    }
  });
</script>
