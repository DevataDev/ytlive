<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Video | YukLive!</title>
    <meta name="description" content="YukLive! Upload Video">
    <meta name="author" content="YukLive!">
    <meta name="keywords" content="YukLive!, Stream Manager, YouTube Live, Live Stream, Live Streaming, Streaming">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="shortcut icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/header.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    // Initialize header active state
    function setActiveNavItem() {
        const currentPath = window.location.pathname;
        const navLinks = document.querySelectorAll('.nav-link, .dropdown-item');
        
        navLinks.forEach(link => {
            if (link.getAttribute('href') === currentPath) {
                link.classList.add('active');
                // If it's a dropdown item, also activate its parent dropdown
                const dropdownItem = link.closest('.dropdown-item');
                if (dropdownItem) {
                    const parentDropdown = link.closest('.dropdown');
                    if (parentDropdown) {
                        parentDropdown.querySelector('.nav-link').classList.add('active');
                    }
                }
            }
        });
    }

    // Initialize when DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
        setActiveNavItem();
        
        // Handle logout
        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', function() {
                // Add your logout logic here
                window.location.href = '/logout';
            });
        }
    });
    </script>
</head>
<body>
<header class="app-header">
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid px-3 px-lg-4">
            <a class="navbar-brand" href="/dashboard">
                <i class="bi bi-broadcast"></i>
                <span>YukLive!</span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" 
                    aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a href="/dashboard" class="nav-link">
                            <i class="bi bi-speedometer2"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/stream" class="nav-link active">
                            <i class="bi bi-camera-reels"></i>
                            <span>Stream</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/mirror" class="nav-link">
                            <i class="bi bi-play-circle"></i>
                            <span>Mirror</span>
                        </a>
                    </li>
                    <li class="nav-item dropdown" id="menuTikTok">
                        <a class="nav-link dropdown-toggle" href="#" id="tiktokDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-tiktok"></i>
                            <span>TikTok</span>
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="tiktokDropdown">
                            <li>
                                <a class="dropdown-item" href="/live">
                                    <i class="bi bi-broadcast me-2"></i>
                                    <span>Live</span>
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" href="/search">
                                    <i class="bi bi-search me-2"></i>
                                    <span>Search</span>
                                </a>
                            </li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a href="/monitor" class="nav-link">
                            <i class="bi bi-graph-up"></i>
                            <span>Monitor</span>
                        </a>
                    </li>
                    <li class="nav-item" id="menuManageChannels">
                        <a href="/channels" class="nav-link">
                            <i class="bi bi-collection-play"></i>
                            <span>Channels</span>
                        </a>
                    </li>
                </ul>
                <button id="logoutBtn" class="btn btn-outline-secondary ms-lg-2">Logout</button>
            </div>
        </div>
    </nav>
</header>
<div class="container dashboard-container">
    <div class="card p-4">
        <form id="uploadForm" enctype="multipart/form-data">
            <div id="dropZone" class="drop-zone">
                <div class="drop-zone-content">
                    <i class="bi bi-cloud-arrow-up"></i>
                    <h5>Drag & drop files here</h5>
                    <p>or click to browse files</p>
                    <p class="small">Supports: MP4, MKV, MOV, MP3, WAV (Max 2GB per file)</p>
                </div>
                <input type="file" id="videoFiles" name="videoFiles" multiple accept="video/*,audio/*" class="d-none">
            </div>
            <div id="filePreviews" class="mt-3"></div>
            
            
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <a href="/stream" class="btn btn-outline-secondary me-md-2">
                    <i class="bi bi-x-circle me-1"></i> Cancel
                </a>
                <button type="submit" class="btn btn-primary" id="submitBtn">
                    <i class="bi bi-upload me-1"></i> Upload Files
                </button>
            </div>
            
            <!-- Upload Progress -->
            <div class="progress mt-4 d-none" id="uploadProgress" style="height: 8px;">
                <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
        </form>
        <div id="uploadStatus" class="mt-3"></div>
    </div>
</div>
<footer class="text-center text-muted py-3" id="footer"></footer>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
const sinceYear = 2025;
const nowYear = new Date().getFullYear();
let yearStr = sinceYear === nowYear ? `${sinceYear}` : `${sinceYear} - ${nowYear}`;

function loadScript(version = '0.4.3') {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = `/static/js/upload-new.js?v=${version}`;
    script.onload = () => resolve();
    script.onerror = (err) => reject(err);
    document.body.appendChild(script);
  });
}

// Set up the footer and load the script
fetch('/api/version')
  .then(res => res.json())
  .then(data => {
    let versionStr = '';
    if (data.version && data.commit) {
      versionStr = ` | <span class='text-secondary'>Version: ${data.version} (<code>${data.commit.slice(0,7)}</code>)</span>`;
    }
    document.getElementById('footer').innerHTML = `&copy; ${yearStr} Yuk Live! By PT Jejaring Internet Bersama${versionStr}`;
    return loadScript(data.version || '0.4.3');
  })
  .catch((err) => {
    console.error("Error initializing app:", err);
    document.getElementById('footer').innerHTML = `&copy; ${yearStr} Yuk Live! By PT Jejaring Internet Bersama`;
    return loadScript('0.4.3');
  })
  .finally(() => {
    initApp();
  });
</script>
</body>
</html>
