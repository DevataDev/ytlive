<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YukLive! User Management</title>
    <meta name="description" content="YukLive! Stream Manager">
    <meta name="author" content="YukLive!">
    <meta name="keywords" content="YukLive!, Stream Manager, YouTube Live, Live Stream, Live Streaming, Streaming">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="shortcut icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/user-management.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
</head>
<body>
<header class="sticky-top bg-white border-bottom shadow-sm mb-4">
    <nav class="navbar navbar-expand-lg bg-white">
        <div class="container-fluid">
            <span class="fw-bold fs-4 me-3">YukLive!</span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a href="/dashboard" class="nav-link">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a href="/stream" class="nav-link">Stream</a>
                    </li>
                    <li class="nav-item">
                        <a href="/mirror" class="nav-link">Mirror</a>
                    </li>
                    <li class="nav-item">
                        <a href="/live" class="nav-link">TikTok Live</a>
                    </li>
                    <li class="nav-item">
                        <a href="/search" class="nav-link">TikTok Search</a>
                    </li>
                    <li class="nav-item">
                        <a href="/users" class="nav-link active">User Management</a>
                    </li>
                    <li class="nav-item">
                        <a href="/monitor" class="nav-link">Monitor</a>
                    </li>
                </ul>
                <button id="logoutBtn" class="btn btn-outline-secondary ms-lg-2">Logout</button>
            </div>
        </div>
    </nav>
</header>
<div class="container-fluid py-5 user-management-wide-container">
    <h2 class="mb-4">User Management</h2>
    <div class="card p-4">
        <form id="addUserForm" class="row g-3 mb-4">
            <div class="col-md-3">
                <input type="text" class="form-control" id="addUsername" placeholder="Username" required>
            </div>
            <div class="col-md-3">
                <input type="email" class="form-control" id="addEmail" placeholder="Email" required>
            </div>
            <div class="col-md-3">
                <div class="input-group">
                    <input type="password" class="form-control" id="addPassword" placeholder="Password" required>
                    <button class="btn btn-outline-secondary toggle-password" type="button" tabindex="-1"><i class="fa fa-eye"></i></button>
                </div>
            </div>
            <div class="col-md-2 d-flex align-items-center">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="addIsAdmin">
                    <label class="form-check-label" for="addIsAdmin">Admin</label>
                </div>
            </div>
            <div class="col-md-1">
                <button type="submit" class="btn btn-primary w-100">Add</button>
            </div>
        </form>
        <div class="table-responsive">
            <table class="table align-middle" id="userTable">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Admin</th>
                        <th>Active</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- User rows will be injected here -->
                </tbody>
            </table>
        </div>
        <ul class="pagination justify-content-center mt-3" id="pagination"></ul>
    </div>
</div>
<!-- Password Update Modal -->
<div class="modal fade" id="updatePasswordModal" tabindex="-1" aria-labelledby="updatePasswordModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="updatePasswordModalLabel">Update User Password</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="updatePasswordForm">
          <div class="mb-3">
            <label for="updatePasswordInput" class="form-label">New Password</label>
            <input type="password" class="form-control" id="updatePasswordInput" required>
          </div>
          <input type="hidden" id="updatePasswordUsername">
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary" form="updatePasswordForm">Update Password</button>
      </div>
    </div>
  </div>
</div>
<footer class="footer mt-auto py-3 bg-light text-center w-100" style="position:fixed;bottom:0;left:0;z-index:1030;">
    <div class="container">
        <script>
        const sinceYear = 2025;
const nowYear = new Date().getFullYear();
let yearStr = sinceYear === nowYear ? `${sinceYear}` : `${sinceYear} - ${nowYear}`;

fetch('/api/version')
  .then(res => res.json())
  .then(data => {
    let versionStr = '';
    if (data.version && data.commit) {
      versionStr = ` | <span class='text-secondary'>Version: ${data.version} (<code>${data.commit.slice(0,7)}</code>)</span>`;
    }
    document.querySelector('footer').innerHTML = `&copy; ${yearStr} Yuk Live! By PT Jejaring Internet Bersama${versionStr}`;
    const script = document.createElement('script');
    script.src = `/static/js/user-management.js?v=${data.version ? data.version : '0.4.3'}`;
    document.body.appendChild(script);
  })
  .catch(() => {
    document.querySelector('footer').innerHTML = `&copy; ${yearStr} Yuk Live! By PT Jejaring Internet Bersama`;
    const script = document.createElement('script');
    script.src = `/static/js/user-management.js?v=0.4.3`;
    document.body.appendChild(script);
  });
        </script>
    </div>
</footer>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</body>
</html>
