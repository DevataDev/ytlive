<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/header.css">
    <link rel="stylesheet" href="/static/css/user-management.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    // Initialize header active state
    function setActiveNavItem() {
        const currentPath = window.location.pathname;
        const navLinks = document.querySelectorAll('.nav-link, .dropdown-item');
        
        navLinks.forEach(link => {
            if (link.getAttribute('href') === currentPath) {
                link.classList.add('active');
                // If it's a dropdown item, also activate its parent dropdown
                const dropdownItem = link.closest('.dropdown-item');
                if (dropdownItem) {
                    const parentDropdown = link.closest('.dropdown');
                    if (parentDropdown) {
                        parentDropdown.querySelector('.nav-link').classList.add('active');
                    }
                }
            }
        });
    }

    // Initialize when DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
        setActiveNavItem();
        
        // Handle logout
        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', function() {
                // Add your logout logic here
                window.location.href = '/logout';
            });
        }
    });
    </script>
</head>
<body>
<header class="app-header">
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid px-3 px-lg-4">
            <a class="navbar-brand" href="/dashboard">
                <i class="bi bi-broadcast"></i>
                <span>YukLive!</span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" 
                    aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a href="/dashboard" class="nav-link">
                            <i class="bi bi-speedometer2"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/stream" class="nav-link">
                            <i class="bi bi-camera-reels"></i>
                            <span>Stream</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/mirror" class="nav-link">

                            <span>Mirror</span>
                        </a>
                    </li>
                    <li class="nav-item dropdown" id="menuTikTok">
                        <a class="nav-link dropdown-toggle" href="#" id="tiktokDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-tiktok"></i>

                        <ul class="dropdown-menu" aria-labelledby="tiktokDropdown">
                            <li>
                                <a class="dropdown-item" href="/live">
                                    <i class="bi bi-broadcast me-2"></i>

                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" href="/search">
                                    <i class="bi bi-search me-2"></i>
                                    <span>Search</span>
                                </a>
                            </li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a href="/monitor" class="nav-link">
                            <i class="bi bi-graph-up"></i>

                        </a>
                    </li>
                    <li class="nav-item" id="menuManageChannels">
                        <a href="/channels" class="nav-link">
                            <i class="bi bi-collection-play"></i>
                            <span>Channels</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/users" class="nav-link active">
                            <i class="bi bi-people"></i>

                    </li>
                </ul>
                <button id="logoutBtn" class="btn btn-outline-secondary ms-lg-2">Logout</button>
            </div>
        </div>
    </nav>
</header>
<div class="container-fluid py-5 user-management-wide-container">
    <h2 class="mb-4">User Management</h2>
    <div class="card p-4">
        <form id="addUserForm" class="row g-3 mb-4">
            <div class="col-md-3">
                <input type="text" class="form-control" id="addUsername" placeholder="Username" required>
            </div>
            <div class="col-md-3">
                <input type="email" class="form-control" id="addEmail" placeholder="Email" required>
            </div>
            <div class="col-md-3">
                <div class="input-group">
                    <input type="password" class="form-control" id="addPassword" placeholder="Password" required>
                    <button class="btn btn-outline-secondary toggle-password" type="button" tabindex="-1"><i class="fa fa-eye"></i></button>
                </div>
            </div>
            <div class="col-md-2 d-flex align-items-center">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="addIsAdmin">
                    <label class="form-check-label" for="addIsAdmin">Admin</label>
                </div>
            </div>
            <div class="col-md-1">
                <button type="submit" class="btn btn-primary w-100">Add</button>
            </div>
        </form>
        <div class="table-responsive">
            <table class="table align-middle" id="userTable">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Admin</th>
                        <th>Active</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- User rows will be injected here -->
                </tbody>
            </table>
        </div>
        <ul class="pagination justify-content-center mt-3" id="pagination"></ul>
    </div>
</div>
<!-- Password Update Modal -->
<div class="modal fade" id="updatePasswordModal" tabindex="-1" aria-labelledby="updatePasswordModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="updatePasswordModalLabel">Update User Password</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="updatePasswordForm">
          <div class="mb-3">
            <label for="updatePasswordInput" class="form-label">New Password</label>
            <input type="password" class="form-control" id="updatePasswordInput" required>
          </div>
          <input type="hidden" id="updatePasswordUsername">
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary" form="updatePasswordForm">Update Password</button>
      </div>
    </div>
  </div>
</div>
<footer class="footer mt-auto py-3 bg-light text-center w-100" style="position:fixed;bottom:0;left:0;z-index:1030;">
    <div class="container">
        <script>
        const sinceYear = 2025;
const nowYear = new Date().getFullYear();
let yearStr = sinceYear === nowYear ? `${sinceYear}` : `${sinceYear} - ${nowYear}`;

fetch('/api/version')
  .then(res => res.json())
  .then(data => {
    let versionStr = '';
    if (data.version && data.commit) {
      versionStr = ` | <span class='text-secondary'>Version: ${data.version} (<code>${data.commit.slice(0,7)}</code>)</span>`;
    }
    document.querySelector('footer').innerHTML = `&copy; ${yearStr} Yuk Live! By PT Jejaring Internet Bersama${versionStr}`;
    const script = document.createElement('script');
    script.src = `/static/js/user-management.js?v=${data.version ? data.version : '0.4.3'}`;
    document.body.appendChild(script);
  })
  .catch(() => {
    document.querySelector('footer').innerHTML = `&copy; ${yearStr} Yuk Live! By PT Jejaring Internet Bersama`;
    const script = document.createElement('script');
    script.src = `/static/js/user-management.js?v=0.4.3`;
    document.body.appendChild(script);
  });
        </script>
    </div>
</footer>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</body>
</html>
