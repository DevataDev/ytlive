<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YukLive! Youtube Channels Manager</title>
    <meta name="description" content="YukLive! Youtube Channels Manager">
    <meta name="author" content="YukLive!">
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .monitor-title-ellipsis {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
            max-width: 180px;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <header class="sticky-top bg-white border-bottom shadow-sm mb-4">
        <nav class="navbar navbar-expand-lg bg-white">
            <div class="container-fluid">
                <span class="fw-bold fs-4 me-3">YukLive!</span>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainNavbar">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a href="/dashboard" class="nav-link">Dashboard</a>
                        </li>
                        <li class="nav-item">
                            <a href="/stream" class="nav-link">Stream</a>
                        </li>
                        <li class="nav-item">
                            <a href="/mirror" class="nav-link">Mirror</a>
                        </li>
                        <li class="nav-item">
                            <a href="/live" class="nav-link">TikTok Live</a>
                        </li>
                        <li class="nav-item">
                            <a href="/search" class="nav-link">TikTok Search</a>
                        </li>
                        <li class="nav-item">
                            <a href="/monitor" class="nav-link">Monitor</a>
                        </li>
                        <li class="nav-item" id="menuManageChannels">
                            <a href="/channels" class="nav-link active">Manage Channels</a>
                        </li>
                    </ul>
                    <button id="logoutBtn" class="btn btn-outline-secondary ms-lg-2">Logout</button>
                </div>
            </div>
        </nav>
    </header>
    <main class="flex-fill">
        <div class="container-fluid container-xl dashboard-container">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <span class="badge bg-info me-2">Channels Count: <span id="countChannels">-</span></span>
                </div>
                <form id="add-channel-form" class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">Add Channel</button>
                </form>
            </div>
            <section>
                <h2>Channels</h2>
                <div class="table-responsive" style="max-height:60vh;overflow-y:auto;">
                <table id="channels-table" class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>Channel ID</th>
                            <th>Channel Name</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Channel rows will be injected here -->
                        <tr data-channel-id="channel-1">
                            <td>unique-id-1</td>
                            <td>
                               name
                            </td>
                            <td>
                                <button class="btn btn-sm btn-danger" id="delete-channel-1">Delete</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
                </div>
            </section>
        </div>
    </main>
    <div class="modal fade" id="authorizeModal" tabindex="-1" aria-labelledby="authorizeModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="authorizeModalLabel">Authorize</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- Auth iframe will be injected here -->
                </div>
            </div>
        </div>
    </div>
    <footer class="footer mt-auto py-3 bg-light border-top text-center w-100">
        <span class="text-muted" id="footer-copyright"></span>
    </footer>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/channels-management.js?v=0.4.3"></script>
<script>
const sinceYear = 2025;
const nowYear = new Date().getFullYear();
let yearStr = sinceYear === nowYear ? `${sinceYear}` : `${sinceYear} - ${nowYear}`;
fetch('/api/version')
  .then(res => res.json())
  .then(data => {
    let versionStr = '';
    if (data.version && data.commit) {
      versionStr = ` | <span class='text-secondary'>Version: ${data.version} (<code>${data.commit.slice(0,7)}</code>)</span>`;
    }
    document.getElementById('footer-copyright').innerHTML = `&copy; ${yearStr} Yuk Live! By PT Jejaring Internet Bersama${versionStr}`;
  })
  .catch(() => {
    document.getElementById('footer-copyright').innerHTML = `&copy; ${yearStr} Yuk Live! By PT Jejaring Internet Bersama`;
  });
</script>
</body>
</html>
