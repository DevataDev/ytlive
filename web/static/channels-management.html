<script>
// Initialize header active state
function setActiveNavItem() {
    const currentPath = window.location.pathname;
    const navLinks = document.querySelectorAll('.nav-link, .dropdown-item');
    
    navLinks.forEach(link => {
        if (link.getAttribute('href') === currentPath) {
            link.classList.add('active');
            // If it's a dropdown item, also activate its parent dropdown
            const dropdownItem = link.closest('.dropdown-item');
            if (dropdownItem) {
                const parentDropdown = link.closest('.dropdown');
                if (parentDropdown) {
                    parentDropdown.querySelector('.nav-link').classList.add('active');
                }
            }
        }
    });
}

// Initialize when DOM is loaded
document.addEventListener('DOMContentLoaded', () => {
    setActiveNavItem();
    
    // Handle logout
    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
        logoutBtn.addEventListener('click', function() {
            // Add your logout logic here
            window.location.href = '/logout';
        });
    }
});

// Version and footer initialization
document.addEventListener('DOMContentLoaded', function() {
    // Set current year in footer
    const currentYearElement = document.getElementById('currentYear');
    if (currentYearElement) {
        currentYearElement.textContent = new Date().getFullYear();
    }

    // Set up the version info and load the script
    fetch('/api/version')
        .then(res => res.json())
        .then(data => {
            if (data.version && data.commit) {
                const versionInfo = document.getElementById('versionInfo');
                if (versionInfo) {
                    versionInfo.textContent = `v${data.version} (${data.commit.slice(0,7)})`;
                    versionInfo.title = `Build: ${data.commit}\nDate: ${new Date(data.buildTime).toLocaleString()}`;
                }
            }
            
            // Load the main script
            const script = document.createElement('script');
            script.src = `/static/js/channels-management.js?v=${data.version ? data.version : '0.4.3'}`;
            script.onload = function() {
                if (typeof onload === 'function') onload();
            };
            document.body.appendChild(script);
        })
        .catch(() => {
            const script = document.createElement('script');
            script.src = '/static/js/channels-management.js?v=0.4.4';
            script.onload = function() {
                if (typeof onload === 'function') onload();
            };
            document.body.appendChild(script);

        });
});
</script>
