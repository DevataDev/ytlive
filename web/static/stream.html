<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuk Live! Stream Manager</title>
    <meta name="description" content="YukLive! Stream Manager">
    <meta name="author" content="YukLive!">
    <meta name="keywords" content="YukLive!, Stream Manager, YouTube Live, Live Stream, Live Streaming, Streaming">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="shortcut icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    // Initialize header active state
    function setActiveNavItem() {
        const currentPath = window.location.pathname;
        const navLinks = document.querySelectorAll('.nav-link, .dropdown-item');
        
        navLinks.forEach(link => {
            if (link.getAttribute('href') === currentPath) {
                link.classList.add('active');
                // If it's a dropdown item, also activate its parent dropdown
                const dropdownItem = link.closest('.dropdown-item');
                if (dropdownItem) {
                    const parentDropdown = link.closest('.dropdown');
                    if (parentDropdown) {
                        parentDropdown.querySelector('.nav-link').classList.add('active');
                    }
                }
            }
        });
    }

    // Initialize when DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
        setActiveNavItem();
        
        // Handle logout
        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', function() {
                // Add your logout logic here
                window.location.href = '/logout';
            });
        }
    });
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/header.css">
</head>
<body>
<header class="app-header">
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid px-3 px-lg-4">
            <a class="navbar-brand" href="/dashboard">
                <i class="bi bi-broadcast"></i>
                <span>YukLive!</span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" 
                    aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a href="/dashboard" class="nav-link">
                            <i class="bi bi-speedometer2"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/stream" class="nav-link active">
                            <i class="bi bi-camera-reels"></i>
                            <span>Stream</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/mirror" class="nav-link">
                            <i class="bi bi-play-circle"></i>
                            <span>Mirror</span>
                        </a>
                    </li>
                    <li class="nav-item dropdown" id="menuTikTok">
                        <a class="nav-link dropdown-toggle" href="#" id="tiktokDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-tiktok"></i>
                            <span>TikTok</span>
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="tiktokDropdown">
                            <li>
                                <a class="dropdown-item" href="/live">
                                    <i class="bi bi-broadcast me-2"></i>
                                    <span>Live</span>
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" href="/search">
                                    <i class="bi bi-search me-2"></i>
                                    <span>Search</span>
                                </a>
                            </li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a href="/monitor" class="nav-link">
                            <i class="bi bi-graph-up"></i>
                            <span>Monitor</span>
                        </a>
                    </li>
                    <li class="nav-item" id="menuManageChannels">
                        <a href="/channels" class="nav-link">
                            <i class="bi bi-collection-play"></i>
                            <span>Channels</span>
                        </a>
                    </li>
                </ul>
                
                <div class="d-flex align-items-center">
                    <div class="user-dropdown">
                        <div class="user-avatar" id="userInitials">U</div>
                        <button id="logoutBtn" class="btn btn-outline-primary btn-sm btn-logout">
                            <i class="bi bi-box-arrow-right"></i>
                            <span class="d-none d-sm-inline">Logout</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</header>
<div class="container py-5">
    <div id="streamSection">
        <div class="mb-3">
            <label for="streamKey" class="form-label">YouTube Stream Key</label>
            <input type="text" class="form-control" id="streamKey" placeholder="Enter stream key">
        </div>
        <div class="mb-3">
            <label for="videoName" class="form-label">Video File Name/Path</label>
            <input type="text" class="form-control" id="videoName" placeholder="e.g. sample.mp4 or /path/to/video.mp4">
        </div>
        <div class="mb-3">
            <button id="startBtn" class="btn btn-success">Start Stream</button>
            <button id="stopBtn" class="btn btn-danger">Stop Stream</button>
        </div>
        <div id="status" class="alert alert-info">Disconnected</div>
    </div>
</div>
<footer class="text-center text-muted py-3" id="footer"></footer>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
const sinceYear = 2025;
const nowYear = new Date().getFullYear();
let yearStr = sinceYear === nowYear ? `${sinceYear}` : `${sinceYear} - ${nowYear}`;

fetch('/api/version')
  .then(res => res.json())
  .then(data => {
    let versionStr = '';
    if (data.version && data.commit) {
      versionStr = ` | <span class='text-secondary'>Version: ${data.version} (<code>${data.commit.slice(0,7)}</code>)</span>`;
    }
    document.getElementById('footer').innerHTML = `&copy; ${yearStr} Yuk Live! By PT Jejaring Internet Bersama${versionStr}`;
    const script = document.createElement('script');
    script.src = `/static/js/stream.js?v=${data.version ? data.version : '0.4.3'}`;
    document.body.appendChild(script);
  })
  .catch(() => {
    document.getElementById('footer').innerHTML = `&copy; ${yearStr} Yuk Live! By PT Jejaring Internet Bersama`;
    const script = document.createElement('script');
    script.src = `/static/js/stream.js?v=0.4.3`;
    document.body.appendChild(script);
  });
</script>
</body>
</html>
