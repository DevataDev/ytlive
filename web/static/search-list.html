<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YukLive! TikTok Search List</title>
  <meta name="description" content="YukLive! TikTok Search Explorer">
  <meta name="author" content="YukLive!">
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.10.0/video-js.min.css" rel="stylesheet" />
  <style>
    .room-title-ellipsis {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
      max-width: 180px;
    }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">
  <header class="sticky-top bg-white border-bottom shadow-sm mb-4">
    <nav class="navbar navbar-expand-lg bg-white">
      <div class="container-fluid">
        <span class="fw-bold fs-4 me-3">YukLive!</span>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a href="/dashboard" class="nav-link">Dashboard</a>
            </li>
            <li class="nav-item">
              <a href="/stream" class="nav-link">Stream</a>
            </li>
            <li class="nav-item">
              <a href="/mirror" class="nav-link ">Mirror</a>
            </li>
            <li class="nav-item">
              <a href="/live" class="nav-link">TikTok Live</a>
            </li>
            <li class="nav-item">
              <a href="/search" class="nav-link active">TikTok Search</a>
            </li>
            <li class="nav-item">
              <a href="/monitor" class="nav-link">Monitor</a>
            </li>
          </ul>
          <button id="logoutBtn" class="btn btn-outline-secondary ms-lg-2">Logout</button>
        </div>
      </div>
    </nav>
  </header>
  <main class="flex-fill pb-5">
    <div class="container-fluid container-xl dashboard-container">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <span class="badge bg-info me-2">Search Result Count: <span id="countRoom">-</span></span>
        </div>

        <div class="d-flex align-items-center">
          <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Search...">
          <button id="searchBtn" class="btn btn-primary btn-sm ms-2">Search</button>
        </div>
      </div>
      <!-- Room List Cards -->
      <div id="room-list-cards" class="row g-3">
        <!-- Room cards will be dynamically inserted here -->
      </div>

      <!-- Room Card Template (for reference)
      <div class="col-md-4">
        <div class="card stream-card">
          <div class="card-body">
            <div class="d-flex align-items-center mb-2">
              <span class="fw-bold fs-5 mirror-title-ellipsis" title="DisplayName">DisplayName</span>
            </div>
            <div class="mb-2">
              <video src="LiveUrl" controls class="w-100" style="max-height:180px;background:#000;"></video>
            </div>

              <span class="badge bg-secondary">Offline</span>
              <span class="badge bg-success">Alive</span>

            </div>

              <label class="form-label mb-0">RTMP URL:</label>
              <input type="text" class="form-control form-control-sm mirror-rtmp-url w-100" id="mirror-rtmpurl-input-ID" value="RtmpUrl" style="min-width:200px;max-width:100%;display:inline-block;" />
              <button class="btn btn-outline-success btn-sm ms-2 mirror-rtmpurl-save" data-id="ID" title="Save RTMP URL"><i class="fa fa-save"></i></button>

              <button class="btn btn-outline-success btn-sm ms-1 mirror-streamkey-save" data-id="ID" title="Save Stream Key"><i class="fa fa-save"></i></button>

    </div>
  </main>
  <footer class="footer mt-auto py-3 bg-light border-top text-center w-100">
    <span class="text-muted">&copy; 2025 Yuk Live! By PT Jejaring Internet Bersama</span>
  </footer>
  <!-- Bootstrap Toast Container -->
  <div aria-live="polite" aria-atomic="true" class="position-fixed bottom-0 end-0 p-3" style="z-index: 1080">
    <div id="streamToast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="streamToastBody">
          <!-- Toast message will be injected here -->
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.10.0/video.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
  <script src="/static/js/search-list.js?v=0.3.9"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
