<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YukLive! TikTok Search List</title>
  <meta name="description" content="YukLive! TikTok Search Explorer">
  <meta name="author" content="YukLive!">
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.10.0/video-js.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/header.css">
  <link rel="stylesheet" href="/static/css/footer.css">
  <script>
    // Initialize header active state
    function setActiveNavItem() {
      const currentPath = window.location.pathname;
      const navLinks = document.querySelectorAll('.nav-link, .dropdown-item');

      navLinks.forEach(link => {
        if (link.getAttribute('href') === currentPath) {
          link.classList.add('active');
          // If it's a dropdown item, also activate its parent dropdown
          const dropdownItem = link.closest('.dropdown-item');
          if (dropdownItem) {
            const parentDropdown = link.closest('.dropdown');
            if (parentDropdown) {
              parentDropdown.querySelector('.nav-link').classList.add('active');
            }
          }
        }
      });
    }

    // Initialize when DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
      setActiveNavItem();

      // Handle logout
      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', function () {
          // Add your logout logic here
          window.location.href = '/logout';
        });
      }
    });
  </script>
  <style>
    .room-title-ellipsis {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
      max-width: 100%;
    }

    .video-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      /* 16:9 Aspect Ratio */
      background: #000;
      border-radius: var(--border-radius) var(--border-radius) 0 0;
      overflow: hidden;
    }

    .video-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f9fa;
      border-radius: var(--border-radius) var(--border-radius) 0 0;
    }

    .stream-card {
      border-radius: var(--border-radius);
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .stream-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
    }

    .room-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
    }

    .room-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #e9ecef;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #6c757d;
      flex-shrink: 0;
    }

    .room-info {
      flex: 1;
      min-width: 0;
    }

    .room-title {
      font-size: 1rem;
      font-weight: 600;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .room-username {
      font-size: 0.85rem;
      color: #6c757d;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .viewers-count {
      font-size: 0.85rem;
      color: #6c757d;
    }

    .action-buttons {
      margin-top: 12px;
    }

    .search-container {
      position: relative;
      max-width: 600px;
      margin: 0 auto 2rem;
    }

    .search-input-group {
      position: relative;
      box-shadow: 0 0.25rem 0.75rem rgba(0, 0, 0, 0.1);
      border-radius: 50px;
      overflow: hidden;
    }

    .search-input {
      height: 50px;
      padding-left: 20px;
      padding-right: 120px;
      border: none;
      border-radius: 50px 0 0 50px;
      font-size: 1rem;
    }

    .search-button {
      position: absolute;
      right: 0;
      top: 0;
      height: 100%;
      border-radius: 0 50px 50px 0;
      padding: 0 25px;
      font-weight: 500;
    }

    .search-filters {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 15px;
    }

    .filter-btn {
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.85rem;
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: #0d6efd;
      color: white;
      border-color: #0d6efd;
    }

    .filter-btn:hover {
      background: #e9ecef;
    }

    .filter-btn.active:hover {
      background: #0b5ed7;
    }

    @media (max-width: 768px) {
      .search-input {
        padding-right: 100px;
      }

      .search-button {
        padding: 0 15px;
      }
    }
  </style>
</head>

<body class="d-flex flex-column min-vh-100">
  <header class="app-header">
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid px-3 px-lg-4">
        <a class="navbar-brand" href="/dashboard">
          <i class="bi bi-broadcast"></i>
          <span>YukLive!</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
          aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a href="/dashboard" class="nav-link">
                <i class="bi bi-speedometer2"></i>
                <span>Dashboard</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="/stream" class="nav-link">
                <i class="bi bi-camera-reels"></i>
                <span>Stream</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="/mirror" class="nav-link">
                <i class="bi bi-play-circle"></i>
                <span>Mirror</span>
              </a>
            </li>
            <li class="nav-item dropdown" id="menuTikTok">
              <a class="nav-link dropdown-toggle active" href="#" id="tiktokDropdown" role="button"
                data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-tiktok"></i>
                <span>TikTok</span>
              </a>
              <ul class="dropdown-menu" aria-labelledby="tiktokDropdown">
                <li>
                  <a class="dropdown-item" href="/live">
                    <i class="bi bi-broadcast me-2"></i>
                    <span>Live</span>
                  </a>
                </li>
                <li>
                  <a class="dropdown-item active" href="/search">
                    <i class="bi bi-search me-2"></i>
                    <span>Search</span>
                  </a>
                </li>
              </ul>
            </li>
            <li class="nav-item">
              <a href="/monitor" class="nav-link">
                <i class="bi bi-graph-up"></i>
                <span>Monitor</span>
              </a>
            </li>
            <li class="nav-item" id="menuManageChannels">
              <a href="/channels" class="nav-link">
                <i class="bi bi-collection-play"></i>
                <span>Channels</span>
              </a>
            </li>
          </ul>
          <div class="d-flex align-items-center">
            <div class="user-dropdown">
              <div class="user-avatar" id="userInitials">U</div>
              <button id="logoutBtn" class="btn btn-outline-primary btn-sm btn-logout">
                <i class="bi bi-box-arrow-right"></i>
                <span class="d-none d-sm-inline">Logout</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </nav>
  </header>
  <main class="flex-grow-1 py-4">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12">
          <!-- Search Section -->
          <div class="search-container mb-4">
            <div class="search-input-group">
              <input type="text" id="searchInput" class="form-control search-input"
                placeholder="Search for TikTok users or hashtags...">
              <button class="btn btn-primary search-button" id="searchButton">
                <i class="bi bi-search me-2"></i>Search
              </button>
            </div>
            <div class="search-filters">
              <button class="filter-btn active" data-type="user">Users</button>
              <button class="filter-btn" data-type="hashtag">Hashtags</button>
              <button class="filter-btn" data-type="live">Live Only</button>
            </div>
          </div>

          <!-- Results Count -->
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0">Search Results</h4>
            <span class="badge bg-primary" id="countRoom">0</span>
          </div>

          <!-- Loading Indicator -->
          <div id="loadingIndicator" class="text-center my-5" style="display: none;">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2 text-muted">Finding live streams...</p>
          </div>

          <!-- Results Grid -->
          <div class="row g-4" id="room-list-cards">
            <!-- Results will be loaded here -->
          </div>

          <!-- Load More Button -->
          <div id="loadMoreBtnWrapper" class="text-center my-4">
            <button id="loadMoreBtn" class="btn btn-outline-primary" style="display: none;">
              <i class="bi bi-arrow-down-circle me-2"></i>Load More
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer mt-auto border-top">
    <div class="container py-3">
      <div class="row align-items-center">
        <div class="col-md-6 text-center text-md-start mb-2 mb-md-0">
          <div class="d-flex align-items-center justify-content-center justify-content-md-start">
            <div class="me-3 d-flex align-items-center">
              <i class="bi bi-broadcast me-2 text-primary broadcast-icon"></i>
              <span class="brand-text">Yuk Live!</span>
            </div>
            <div class="vr d-none d-md-block"></div>
            <div class="ms-md-3">
              <span id="versionInfo" class="version-badge"></span>
            </div>
          </div>
        </div>
        <div class="col-md-6 text-center text-md-end">
          <div class="copyright-text">
            &copy; <span id="currentYear"></span> PT Jejaring Internet Bersama. All rights reserved.
          </div>
        </div>
      </div>
    </div>
  </footer>
  <style>
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }

      100% {
        transform: scale(1);
      }
    }

    .footer {
      background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0;
      animation: fadeInUp 0.6s ease-out forwards;
    }

    .footer:hover {
      background: linear-gradient(135deg, #f1f3f5 0%, #f8f9fa 100%);
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
    }

    .vr {
      width: 1px;
      height: 1.5rem;
      background: linear-gradient(to bottom, transparent, rgba(0, 0, 0, 0.1), transparent);
      opacity: 0.7;
      transition: all 0.3s ease;
    }

    .broadcast-icon {
      transition: all 0.3s ease;
      display: inline-block;
    }

    .broadcast-icon:hover {
      animation: pulse 1.5s infinite;
      color: #0d6efd !important;
    }

    .brand-text {
      color: #6c757d;
      font-weight: 500;
      transition: all 0.3s ease;
      position: relative;
    }

    .brand-text::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: -2px;
      left: 0;
      background-color: #0d6efd;
      transition: width 0.3s ease;
    }

    .brand-text:hover::after {
      width: 100%;
    }

    .version-badge {
      display: inline-block;
      padding: 0.3rem 0.7rem;
      font-size: 0.75rem;
      font-weight: 600;
      line-height: 1;
      color: #fff;
      background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
      border-radius: 50rem;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .version-badge::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: 0.5s;
    }

    .version-badge:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
    }

    .version-badge:hover::before {
      left: 100%;
    }

    .copyright-text {
      color: #6c757d;
      font-size: 0.85rem;
      transition: all 0.3s ease;
    }

    .copyright-text:hover {
      color: #495057;
      text-shadow: 0 0 1px rgba(0, 0, 0, 0.1);
    }

    @media (max-width: 767.98px) {
      .footer {
        text-align: center;
      }

      .vr {
        display: none !important;
      }
    }
  </style>
  <!-- Bootstrap Toast Container -->
  <div aria-live="polite" aria-atomic="true" class="position-fixed bottom-0 end-0 p-3" style="z-index: 1080">
    <div id="streamToast" class="toast align-items-center border-0" role="alert" aria-live="assertive"
      aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="streamToastBody">
          <!-- Toast message will be injected here -->
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
          aria-label="Close"></button>
      </div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.10.0/video.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
  <script>
    const sinceYear = 2025;
    const nowYear = new Date().getFullYear();
    let yearStr = sinceYear === nowYear ? `${sinceYear}` : `${sinceYear} - ${nowYear}`;
    // Set current year in footer
    document.getElementById('currentYear').textContent = new Date().getFullYear();

    // Set up the version info and load the script
    fetch('/api/version')
      .then(res => res.json())
      .then(data => {
        if (data.version && data.commit) {
          const versionInfo = document.getElementById('versionInfo');
          versionInfo.textContent = `v${data.version} (${data.commit.slice(0, 7)})`;
          versionInfo.title = `Build: ${data.commit}\nDate: ${new Date(data.buildTime).toLocaleString()}`;
        }
        const script = document.createElement('script');
        script.src = `/static/js/search-list.js?v=${data.version ? data.version : '0.4.3'}`;
        document.body.appendChild(script);
      })
      .catch((err) => {
        console.error("Error initializing app:", err);
        const script = document.createElement('script');
        script.src = '/static/js/search-list.js?v=0.4.3';
        document.body.appendChild(script);
      });
  </script>
</body>

</html>
