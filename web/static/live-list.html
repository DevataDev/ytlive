    <script>
    // Initialize header active state
    function setActiveNavItem() {
        const currentPath = window.location.pathname;
        const navLinks = document.querySelectorAll('.nav-link, .dropdown-item');
        
        navLinks.forEach(link => {
            if (link.getAttribute('href') === currentPath) {
                link.classList.add('active');
                // If it's a dropdown item, also activate its parent dropdown
                const dropdownItem = link.closest('.dropdown-item');
                if (dropdownItem) {
                    const parentDropdown = link.closest('.dropdown');
                    if (parentDropdown) {
                        parentDropdown.querySelector('.nav-link').classList.add('active');
                    }
                }
            }
        });
    }

    // Initialize when DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
        setActiveNavItem();
        
        // Handle logout
        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', function() {
                // Add your logout logic here
                window.location.href = '/logout';
            });
        }
    });
    </script>
    <style>
        /* Base styles */
        :root {
            --primary-color: #4361ee;
            --success-color: #06d6a0;
            --danger-color: #ef476f;
            --warning-color: #ffd166;
            --dark-color: #212529;
            --light-color: #f8f9fa;
            --border-radius: 8px;
            --box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --transition: all 0.3s ease;
        }

        body {
            background-color: #f5f7fb;
            color: #4a5568;
        }

        /* Card styles */
        .stream-card {
            border: none;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            transition: var(--transition);
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #fff;
        }

        .stream-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .card-body {
            padding: 1.25rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Video container */
        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
            border-radius: var(--border-radius);
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Room info */
        .room-header {
            display: flex;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }

        .room-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 0.75rem;
            object-fit: cover;
            background: var(--light-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
            font-weight: bold;
            font-size: 1.1rem;
        }

        .room-info {
            flex: 1;
            min-width: 0;
        }

        .room-title {
            font-weight: 600;
            font-size: 1rem;
            margin: 0 0 0.25rem 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--dark-color);
        }

        .room-username {
            font-size: 0.85rem;
            color: #6c757d;
            margin: 0;
        }

        /* Stats and badges */
        .room-stats {
            display: flex;
            align-items: center;
            margin: 0.5rem 0;
            font-size: 0.85rem;
            color: #6c757d;
        }

        .badge {
            font-weight: 500;
            padding: 0.35em 0.65em;
            font-size: 0.75em;
            border-radius: 4px;
        }

        .viewers-count {
            display: inline-flex;
            align-items: center;
            margin-right: 0.75rem;
        }

        .viewers-count i {
            margin-right: 0.25rem;
            color: var(--danger-color);
        }

        /* Buttons */
        .action-buttons {
            margin-top: auto;
            padding-top: 0.75rem;
        }

        .btn {
            border-radius: 6px;
            font-weight: 500;
            padding: 0.5rem 1rem;
            transition: var(--transition);
        }

        .btn-sm {
            padding: 0.25rem 0.75rem;
            font-size: 0.85rem;
        }

        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .btn-success {
            background-color: var(--success-color);
            border-color: var(--success-color);
        }

        .btn-outline-primary {
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .btn-outline-primary:hover {
            background-color: var(--primary-color);
            color: white;
        }

        /* Loading state */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Responsive adjustments */
        @media (max-width: 767.98px) {
            .col-md-4 {
                flex: 0 0 100%;
                max-width: 100%;
            }
            
            .stream-card {
                margin-bottom: 1.5rem;
            }
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
    </style>
</head>

    <style>
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
    }

    .footer {
        background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        opacity: 0;

    .vr {

        width: 0;
        height: 2px;
        bottom: -2px;
        left: 0;
        background-color: #0d6efd;
        transition: width 0.3s ease;

    .brand-text:hover::after {

    .version-badge {

        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
    }
    .version-badge::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);

    <script>
    // Set current year in footer
    document.getElementById('currentYear').textContent = new Date().getFullYear();

    // Set up the version info and load the script
    fetch('/api/version')
      .then(res => res.json())
      .then(data => {
        if (data.version && data.commit) {
          const versionInfo = document.getElementById('versionInfo');
          versionInfo.textContent = `v${data.version} (${data.commit.slice(0,7)})`;
          versionInfo.title = `Build: ${data.commit}\nDate: ${new Date(data.buildTime).toLocaleString()}`;
        }
        const script = document.createElement('script');
        script.src = `/static/js/live-list.js?v=${data.version ? data.version : '0.4.3'}`;
        document.body.appendChild(script);
      })
      .catch((err) => {
        console.error("Error initializing app:", err);
        const script = document.createElement('script');
        script.src = '/static/js/live-list.js?v=0.4.3';
        document.body.appendChild(script);
      });
    </script>
