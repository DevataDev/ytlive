<!DOCTYPE html>

    <link rel="stylesheet" href="/static/css/header.css">
    <link rel="stylesheet" href="/static/css/footer.css">
    <script>
    // Initialize header active state
    function setActiveNavItem() {
        const currentPath = window.location.pathname;
        const navLinks = document.querySelectorAll('.nav-link, .dropdown-item');
        
        navLinks.forEach(link => {
            if (link.getAttribute('href') === currentPath) {
                link.classList.add('active');
                // If it's a dropdown item, also activate its parent dropdown
                const dropdownItem = link.closest('.dropdown-item');
                if (dropdownItem) {
                    const parentDropdown = link.closest('.dropdown');
                    if (parentDropdown) {
                        parentDropdown.querySelector('.nav-link').classList.add('active');
                    }
                }
            }
        });
    }

    // Initialize when DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
        setActiveNavItem();
        
        // Handle logout
        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', function() {
                // Add your logout logic here
                window.location.href = '/logout';
            });
        }
    });
    </script>
    <style>
        .monitor-title-ellipsis {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
            max-width: 180px;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <main class="flex-grow-1 py-3">
        <div class="container-fluid">
            <div class="container-xl">
                <div class="dashboard-container">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <span class="badge bg-info me-2">Monitor Count: <span id="countMonitor">-</span></span>
                </div>
                <form id="add-monitor-form" class="d-flex gap-2">
                    <input type="text" id="uniqueId" name="uniqueId" class="form-control" placeholder="TikTok Unique ID" required>
                    <button type="submit" class="btn btn-success">Add Monitor</button>
                </form>
            </div>
            <section>
                <h2>Monitored Users</h2>
                <div class="table-responsive" style="max-height:60vh;overflow-y:auto;">
                <table id="monitor-table" class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>Unique ID</th>
                            <th>RTMP URL</th>
                            <th>Stream Key</th>
                            <th>Is Live</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Monitor rows will be injected here -->
                        <tr data-monitor-id="monitor-1">
                            <td>unique-id-1</td>
                            <td>
                                <input type="text" class="form-control form-control-sm" id="rtmp-url-1" value="rtmp://example.com/live/1">
                                <button class="btn btn-sm btn-primary" id="save-rtmp-url-1">Save</button>
                            </td>
                            <td>
                                <input type="text" class="form-control form-control-sm" id="stream-key-1" value="stream-key-1">
                                <button class="btn btn-sm btn-primary" id="save-stream-key-1">Save</button>
                            </td>
                            <td>Yes</td>
                            <td>
                                <button class="btn btn-sm btn-danger" id="delete-monitor-1">Delete</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
                </div>
            </section>
        </div>
    </main>

    <!-- Bind Channel Modal -->

            <h5 class="modal-title" id="bindChannelModalLabel">Bind Channel to Monitor</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>

          <div class="modal-body">

            <select class="form-select" id="channelSelect"></select>
            <label for="streamSelect" class="form-label mt-3">Select Live Stream</label>
            <select class="form-select" id="streamSelect"></select>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="bindChannelSaveBtn">Bind</button>

        </div>
      </div>
    </div>
    <div id="bindChannelModalBackdrop" class="modal-backdrop fade" style="display:none;"></div>

                </div>
            </div>
        </div>
    </main>

    <footer class="footer mt-auto border-top">
        <div class="container py-3">
            <div class="row align-items-center">
                <div class="col-md-6 text-center text-md-start mb-2 mb-md-0">
                    <div class="d-flex align-items-center justify-content-center justify-content-md-start">
                        <div class="me-3 d-flex align-items-center">
                            <i class="bi bi-broadcast me-2 text-primary broadcast-icon"></i>
                            <span class="brand-text">Yuk Live!</span>
                        </div>
                        <div class="vr d-none d-md-block"></div>
                        <div class="ms-md-3">

                    </div>

                <div class="col-md-6 text-center text-md-end">

                        &copy; <span id="currentYear"></span> PT Jejaring Internet Bersama. All rights reserved.
                    </div>
                </div>
            </div>
        </div>
    </footer>
    <style>
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
    }

    .footer {
        background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        opacity: 0;
        animation: fadeInUp 0.6s ease-out forwards;
    }

    .footer:hover {
        background: linear-gradient(135deg, #f1f3f5 0%, #f8f9fa 100%);
        box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
    }

    .vr {
        width: 1px;
        height: 1.5rem;
        background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.1), transparent);
        opacity: 0.7;
        transition: all 0.3s ease;
    }

    .broadcast-icon {
        transition: all 0.3s ease;
        display: inline-block;
    }

    .broadcast-icon:hover {
        animation: pulse 1.5s infinite;
        color: #0d6efd !important;
    }

    .brand-text {
        color: #6c757d;
        font-weight: 500;
        transition: all 0.3s ease;
        position: relative;
    }

    .brand-text::after {
        content: '';
        position: absolute;
        width: 0;
        height: 2px;
        bottom: -2px;
        left: 0;
        background-color: #0d6efd;
        transition: width 0.3s ease;
    }
    .brand-text:hover::after {
        width: 100%;
    }
    .version-badge {
        display: inline-block;
        padding: 0.3rem 0.7rem;
        font-size: 0.75rem;
        font-weight: 600;
        line-height: 1;
        color: #fff;
        background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
        border-radius: 50rem;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
    }
    .version-badge::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: 0.5s;
    }
    .version-badge:hover {
        transform: translateY(-2px) scale(1.03);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
    }
    .version-badge:hover::before {
        left: 100%;
    }
    .copyright-text {
        color: #6c757d;
        font-size: 0.85rem;
        transition: all 0.3s ease;
    }
    .copyright-text:hover {
        color: #495057;
        text-shadow: 0 0 1px rgba(0, 0, 0, 0.1);
    }
    @media (max-width: 767.98px) {
        .footer {
            text-align: center;
        }
        .vr {
            display: none !important;
        }
    }
    </style>

    <!-- Bootstrap Toast Container -->
    <div aria-live="polite" aria-atomic="true" class="position-fixed bottom-0 end-0 p-3" style="z-index: 1080">
        <div id="monitorToast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">

                    <!-- Toast message will be injected here -->
                </div>

            </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    // Set current year in footer
    document.getElementById('currentYear').textContent = new Date().getFullYear();

    // Set up the version info and load the script
    fetch('/api/version')
        .then(res => res.json())
        .then(data => {
            if (data.version && data.commit) {
                const versionInfo = document.getElementById('versionInfo');
                versionInfo.textContent = `v${data.version} (${data.commit.slice(0,7)})`;
                versionInfo.title = `Build: ${data.commit}\nDate: ${new Date(data.buildTime).toLocaleString()}`;
            }
            const script = document.createElement('script');
            script.src = `/static/js/monitor-management.js?v=${data.version ? data.version : '0.4.3'}`;
            script.onload = () => {
                if (typeof initMonitor === 'function') {
                    initMonitor();
                }
            };
            document.body.appendChild(script);
        })
        .catch((err) => {
            console.error("Error initializing app:", err);
            const script = document.createElement('script');
            script.src = '/static/js/monitor-management.js?v=0.4.3';
            script.onload = () => {
                if (typeof initMonitor === 'function') {
                    initMonitor();
                }
            };
            document.body.appendChild(script);
        });
    </script>
</body>
</html>
