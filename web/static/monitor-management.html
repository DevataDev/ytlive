<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage TikTok User Monitor</title>
    <meta name="description" content="YukLive! Monitor Manager">
    <meta name="author" content="YukLive!">
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/header.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    // Initialize header active state
    function setActiveNavItem() {
        const currentPath = window.location.pathname;
        const navLinks = document.querySelectorAll('.nav-link, .dropdown-item');
        
        navLinks.forEach(link => {
            if (link.getAttribute('href') === currentPath) {
                link.classList.add('active');
                // If it's a dropdown item, also activate its parent dropdown
                const dropdownItem = link.closest('.dropdown-item');
                if (dropdownItem) {
                    const parentDropdown = link.closest('.dropdown');
                    if (parentDropdown) {
                        parentDropdown.querySelector('.nav-link').classList.add('active');
                    }
                }
            }
        });
    }

    // Initialize when DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
        setActiveNavItem();
        
        // Handle logout
        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', function() {
                // Add your logout logic here
                window.location.href = '/logout';
            });
        }
    });
    </script>
    <style>
        .monitor-title-ellipsis {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
            max-width: 180px;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <header class="app-header">
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid px-3 px-lg-4">
                <a class="navbar-brand" href="/dashboard">
                    <i class="bi bi-broadcast"></i>
                    <span>YukLive!</span>
                </a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" 
                        aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <div class="collapse navbar-collapse" id="mainNavbar">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a href="/dashboard" class="nav-link">
                                <i class="bi bi-speedometer2"></i>
                                <span>Dashboard</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="/stream" class="nav-link">
                                <i class="bi bi-camera-reels"></i>
                                <span>Stream</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="/mirror" class="nav-link">
                                <i class="bi bi-play-circle"></i>
                                <span>Mirror</span>
                            </a>
                        </li>
                        <li class="nav-item dropdown" id="menuTikTok">
                            <a class="nav-link dropdown-toggle" href="#" id="tiktokDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="bi bi-tiktok"></i>
                                <span>TikTok</span>
                            </a>
                            <ul class="dropdown-menu" aria-labelledby="tiktokDropdown">
                                <li>
                                    <a class="dropdown-item" href="/live">
                                        <i class="bi bi-broadcast me-2"></i>
                                        <span>Live</span>
                                    </a>
                                </li>
                                <li>
                                    <a class="dropdown-item" href="/search">
                                        <i class="bi bi-search me-2"></i>
                                        <span>Search</span>
                                    </a>
                                </li>
                            </ul>
                        </li>
                        <li class="nav-item">
                            <a href="/monitor" class="nav-link active">
                                <i class="bi bi-graph-up"></i>
                                <span>Monitor</span>
                            </a>
                        </li>
                        <li class="nav-item" id="menuManageChannels">
                            <a href="/channels" class="nav-link">
                                <i class="bi bi-collection-play"></i>
                                <span>Channels</span>
                            </a>
                        </li>
                    </ul>
                    
                    <div class="d-flex align-items-center">
                        <div class="user-dropdown">
                            <div class="user-avatar" id="userInitials">U</div>
                            <button id="logoutBtn" class="btn btn-outline-primary btn-sm btn-logout">
                                <i class="bi bi-box-arrow-right"></i>
                                <span class="d-none d-sm-inline">Logout</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <main class="flex-fill">
        <div class="container-fluid container-xl dashboard-container">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <span class="badge bg-info me-2">Monitor Count: <span id="countMonitor">-</span></span>
                </div>
                <form id="add-monitor-form" class="d-flex gap-2">
                    <input type="text" id="uniqueId" name="uniqueId" class="form-control" placeholder="TikTok Unique ID" required>
                    <button type="submit" class="btn btn-success">Add Monitor</button>
                </form>
            </div>
            <section>
                <h2>Monitored Users</h2>
                <div class="table-responsive" style="max-height:60vh;overflow-y:auto;">
                <table id="monitor-table" class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>Unique ID</th>
                            <th>RTMP URL</th>
                            <th>Stream Key</th>
                            <th>Is Live</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Monitor rows will be injected here -->
                        <tr data-monitor-id="monitor-1">
                            <td>unique-id-1</td>
                            <td>
                                <input type="text" class="form-control form-control-sm" id="rtmp-url-1" value="rtmp://example.com/live/1">
                                <button class="btn btn-sm btn-primary" id="save-rtmp-url-1">Save</button>
                            </td>
                            <td>
                                <input type="text" class="form-control form-control-sm" id="stream-key-1" value="stream-key-1">
                                <button class="btn btn-sm btn-primary" id="save-stream-key-1">Save</button>
                            </td>
                            <td>Yes</td>
                            <td>
                                <button class="btn btn-sm btn-danger" id="delete-monitor-1">Delete</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
                </div>
            </section>
        </div>
    </main>

    <!-- Bind Channel Modal -->
    <div class="modal fade" id="bindChannelModal" tabindex="-1" aria-labelledby="bindChannelModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="bindChannelModalLabel">Bind Channel to Monitor</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <label for="channelSelect" class="form-label">Select Channel</label>
            <select class="form-select" id="channelSelect"></select>
            <label for="streamSelect" class="form-label mt-3">Select Live Stream</label>
            <select class="form-select" id="streamSelect"></select>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="bindChannelSaveBtn">Bind</button>
          </div>
        </div>
      </div>
    </div>
    <div id="bindChannelModalBackdrop" class="modal-backdrop fade" style="display:none;"></div>

    <footer class="footer mt-auto py-3 bg-light border-top text-center w-100">
        <span class="text-muted" id="footer-copyright"></span>
    </footer>
    <div aria-live="polite" aria-atomic="true" class="position-fixed bottom-0 end-0 p-3" style="z-index: 1080">
        <div id="monitorToast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
          <div class="d-flex">
            <div class="toast-body" id="monitorToastBody">
              <!-- Toast message will be injected here -->
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
          </div>
        </div>
      </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const sinceYear = 2025;
const nowYear = new Date().getFullYear();
let yearStr = sinceYear === nowYear ? `${sinceYear}` : `${sinceYear} - ${nowYear}`;
fetch('/api/version')
  .then(res => res.json())
  .then(data => {
    let versionStr = '';
    if (data.version && data.commit) {
      versionStr = ` | <span class='text-secondary'>Version: ${data.version} (<code>${data.commit.slice(0,7)}</code>)</span>`;
    }
    document.getElementById('footer-copyright').innerHTML = `&copy; ${yearStr} Yuk Live! By PT Jejaring Internet Bersama${versionStr}`;
    const script = document.createElement('script');
    script.src = `/static/js/monitor-management.js?v=${data.version ? data.version : '0.4.3'}`;
    script.async = true;
    script.onload = () => {
        initMonitor();
    };
    document.body.appendChild(script);
  })
  .catch(() => {
    document.getElementById('footer-copyright').innerHTML = `&copy; ${yearStr} Yuk Live! By PT Jejaring Internet Bersama`;
    const script = document.createElement('script');
    script.src = `/static/js/monitor-management.js?v=0.4.3`;
    script.async = true;
    script.onload = () => {
        initMonitor();
    };
    document.body.appendChild(script);
  });
</script>
</body>
</html>
