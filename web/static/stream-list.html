<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YukLive! Stream List</title>
    <meta name="description" content="YukLive! Stream Manager">
    <meta name="author" content="YukLive!">
    <meta name="keywords" content="YukLive!, Stream Manager, YouTube Live, Live Stream, Live Streaming, Streaming">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="shortcut icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .live-indicator {
            width: 18px; height: 18px; border-radius: 50%; background: #ff4b2b;
            display: inline-block; margin-right: 8px; box-shadow: 0 0 8px #ff4b2b;
            animation: liveBlink 1s infinite;
        }
        @keyframes liveBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        #footer.fixed-bottom {
            z-index: 1050;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
        }
        body { padding-bottom: 56px; }
        #pagination {
            margin-bottom: 80px;
        }
        .stream-title-ellipsis {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
            max-width: 180px;
        }
    </style>
</head>
<body>
<header class="sticky-top bg-white border-bottom shadow-sm mb-4">
    <nav class="navbar navbar-expand-lg bg-white">
        <div class="container-fluid">
            <span class="fw-bold fs-4 me-3">YukLive!</span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a href="/dashboard" class="nav-link">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a href="/stream" class="nav-link active">Stream</a>
                    </li>
                    <li class="nav-item">
                        <a href="/mirror" class="nav-link">Mirror</a>
                    </li>
                    <li class="nav-item">
                      <a href="/live" class="nav-link">TikTok Live</a>
                  </li>
                </ul>
                <button id="logoutBtn" class="btn btn-outline-secondary ms-lg-2">Logout</button>
            </div>
        </div>
    </nav>
</header>
<div class="container-fluid container-xl dashboard-container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <span class="badge bg-danger me-2">Live Started: <span id="countLive">-</span></span>
            <span class="badge bg-primary">Live Scheduled: <span id="countScheduled">-</span></span>
        </div>
        <button class="btn btn-success" id="uploadBtn">Upload Video</button>
    </div>
    <!-- Stream List Cards -->
    <div id="stream-list-cards" class="row g-3">
        <!-- Stream cards will be dynamically inserted here -->
    </div>
    <!-- Video Preview Modal -->
    <div class="modal fade" id="videoPreviewModal" tabindex="-1" aria-labelledby="videoPreviewModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="videoPreviewModalLabel">Video Preview</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="ratio ratio-16x9" style="max-width: 100%;">
              <video id="videoPreview" style="object-fit: contain; width: 100%; height: 100%; max-height: 70vh; background: #000" controls>
                <source id="videoPreviewSource" src="" type="video/mp4">
                Your browser does not support the video tag.
              </video>
            </div>
          </div>
        </div>
      </div>
    </div>
    <nav>
        <ul class="pagination justify-content-center" id="pagination">
            <!-- Pagination will be injected here -->
        </ul>
    </nav>
</div>
<footer class="text-center text-muted py-3 fixed-bottom bg-white border-top shadow-sm" id="footer"></footer>
<!-- Bootstrap Toast Container -->
<div aria-live="polite" aria-atomic="true" class="position-fixed bottom-0 end-0 p-3" style="z-index: 1080">
  <div id="streamToast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body" id="streamToastBody">
        <!-- Toast message will be injected here -->
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
</div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="/static/js/stream-list.js?v=0.3.5"></script>
<script>
const sinceYear = 2025;
const nowYear = new Date().getFullYear();
let yearStr = sinceYear === nowYear ? `${sinceYear}` : `${sinceYear} - ${nowYear}`;
document.getElementById('footer').innerHTML = `&copy; ${yearStr} Yuk Live! By PT Jejaring Internet Bersama`;
</script>

<!-- Schedule Modal -->
<div class="modal fade" id="scheduleModal" tabindex="-1" aria-labelledby="scheduleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="scheduleModalLabel">Schedule Stream</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="scheduleForm">
          <div class="mb-3">
            <label for="scheduleStart" class="form-label">Start Time</label>
            <input type="datetime-local" class="form-control" id="scheduleStart" required>
          </div>
          <div class="mb-3">
            <label for="scheduleEnd" class="form-label">End Time</label>
            <input type="datetime-local" class="form-control" id="scheduleEnd" required>
          </div>
          <input type="hidden" id="scheduleStreamId">
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveScheduleBtn">Save Schedule</button>
      </div>
    </div>
  </div>
</div>

<!-- Rename Modal -->
<div class="modal fade" id="renameModal" tabindex="-1" aria-labelledby="renameModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="renameModalLabel">Rename File Name</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="text" class="form-control" id="renameModalInput" />
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="renameModalSave">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- Add Duration Tooltip Template -->
<div id="durationTooltipTemplate" style="display:none;">
  <div class="card p-2" style="min-width:220px;">
    <label for="durationInput" class="form-label mb-1">Set Stream Duration (hours)</label>
    <input type="number" min="0" max="24" step="1" class="form-control mb-2" id="durationInput" value="0">
    <div class="small text-muted mb-2">0 = Unlimited, 1-24 = Limit</div>
    <button class="btn btn-primary btn-sm w-100 set-duration-confirm">Set</button>
  </div>
</div>

<!-- Stream Settings Modal -->
<div class="modal fade" id="settingsModal" tabindex="-1" aria-labelledby="settingsModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="settingsModalLabel">Stream Settings</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="settingsForm">
          <input type="hidden" id="settingsStreamId">
          <div class="mb-3">
            <label for="settingsMode" class="form-label">Mode</label>
            <select class="form-select" id="settingsMode" required>
              <option value="LIVE">LIVE</option>
              <option value="SCHEDULER">SCHEDULER</option>
              <option value="DURATION">DURATION</option>
              <option value="LOOPCOUNT">LOOPCOUNT</option>
            </select>
          </div>
          <div id="schedulerFields" style="display:none;">
            <div class="mb-3">
              <label for="settingsStart" class="form-label">Start Time</label>
              <input type="datetime-local" class="form-control" id="settingsStart">
            </div>
            <div class="mb-3">
              <label for="settingsEnd" class="form-label">End Time</label>
              <input type="datetime-local" class="form-control" id="settingsEnd">
            </div>
          </div>
          <div id="durationField" style="display:none;">
            <div class="mb-3">
              <label for="settingsDuration" class="form-label">Duration (hours, 0-24)</label>
              <input type="number" class="form-control" id="settingsDuration" min="0" max="24" value="0">
            </div>
          </div>
          <div class="mb-3" id="loopCountGroup" style="display:none;">
            <label for="settingsLoopCount" class="form-label">Loop Count</label>
            <input type="number" class="form-control" id="settingsLoopCount" value="-1" min="-1">
            <div class="form-text">-1 means infinite loop. Minimum value is -1.</div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveSettingsBtn">Save Settings</button>
      </div>
    </div>
  </div>
</div>

<script>
// Show/hide scheduler fields based on mode
$('#settingsMode').on('change', function() {
    if ($(this).val() === 'SCHEDULER') {
        $('#schedulerFields').show();
        $('#durationField').hide();
        $('#loopCountGroup').hide();
    } else if ($(this).val() === 'DURATION') {
        $('#schedulerFields').hide();
        $('#durationField').show();
        $('#loopCountGroup').hide();
    } else if ($(this).val() === 'LOOPCOUNT') {
        $('#schedulerFields').hide();
        $('#durationField').hide();
        $('#loopCountGroup').show();
    } else {
        $('#schedulerFields').hide();
        $('#durationField').hide();
        $('#loopCountGroup').hide();
    }
});
// Ensure default value
$('#settingsLoopCount').val('-1');
</script>

</body>
</html>
