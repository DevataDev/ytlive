<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" type="image/x-icon" href="/static/favicon.ico">

<body>

    <nav class="navbar navbar-expand-lg">

            <a class="navbar-brand" href="/dashboard">

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" 
                    aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="mainNavbar">

                    <li class="nav-item">
                        <a href="/dashboard" class="nav-link" id="menuDashboard">

                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/stream" class="nav-link" id="menuStream">
                            <i class="bi bi-camera-reels"></i>
                            <span>Stream</span>
                        </a>
                    </li>
                    <li class="nav-item" id="menuMirror">
                        <a href="/mirror" class="nav-link">
                            <i class="bi bi-play-circle"></i>
                            <span>Mirror</span>
                        </a>
                    </li>
                    <li class="nav-item dropdown" id="menuTikTok">
                        <a class="nav-link dropdown-toggle" href="#" id="tiktokDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-tiktok"></i>

                        </a>
                        <ul class="dropdown-menu" aria-labelledby="tiktokDropdown">

                                <a class="dropdown-item" href="/live" id="menuLive">
                                    <i class="bi bi-broadcast me-2"></i>
                                    <span>Live</span>
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" href="/search" id="menuSearch">
                                    <i class="bi bi-search me-2"></i>

                                </a>
                            </li>
                        </ul>
                    </li>
                    <li class="nav-item" id="menuUserMgmt">
                        <a href="/users" class="nav-link">

                            <span>Users</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/monitor" class="nav-link">
                            <i class="bi bi-graph-up"></i>
                            <span>Monitor</span>
                        </a>
                    </li>
                    <li class="nav-item" id="menuManageChannels">
                        <a href="/channels" class="nav-link">
                            <i class="bi bi-collection-play"></i>
                            <span>Channels</span>

                <div class="d-flex align-items-center">
                    <div class="user-dropdown">
                    <div class="user-avatar" id="userInitials">U</div>

                        <i class="bi bi-box-arrow-right"></i>

                    </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</header>

<script>
// Set active state for current page
function setActiveNavItem() {
    const currentPath = window.location.pathname;
    const navLinks = document.querySelectorAll('.nav-link, .dropdown-item');
    let activeFound = false;
    
    // First, find and activate the matching link
    navLinks.forEach(link => {
        if (link.getAttribute('href') === currentPath) {
            link.classList.add('active');
            // If it's a dropdown item, also activate its parent dropdown
            const dropdownItem = link.closest('.dropdown-item');
            if (dropdownItem) {
                const parentDropdown = link.closest('.dropdown');
                if (parentDropdown) {
                    parentDropdown.querySelector('.nav-link').classList.add('active');
                }
            }
            // Update page title to include section name
            const sectionName = link.querySelector('span')?.textContent || link.textContent.trim();
            if (sectionName) {
                document.title = `${sectionName} | YukLive!`;
            }
            activeFound = true;
        }
    });
    
    // If no active link found, check for parent paths
    if (!activeFound) {
        navLinks.forEach(link => {
            const href = link.getAttribute('href');
            if (href && href !== '#' && currentPath.startsWith(href)) {
                link.classList.add('active');
                // If it's a dropdown item, also activate its parent dropdown
                const dropdownItem = link.closest('.dropdown-item');
                if (dropdownItem) {
                    const parentDropdown = link.closest('.dropdown');
                    if (parentDropdown) {
                        parentDropdown.querySelector('.nav-link').classList.add('active');
                    }
                }
            }
        });
    }
    
    // Set user initials
    const userInitials = 'U'; // Replace with actual user initials
    document.getElementById('userInitials').textContent = userInitials;
}

// Initialize when DOM is loaded
document.addEventListener('DOMContentLoaded', setActiveNavItem);
</script>
<div class="container dashboard-container">
    <h2 class="mb-4">Dashboard</h2>
    <div class="row mb-4">
        <div class="col-md-6 mb-3">
            <div class="card text-center dashboard-card bg-live">
                <div class="card-body">
                    <h5 class="card-title">Live Streams Started</h5>
                    <p class="display-4" id="streamsStarted">-</p>
                </div>
            </div>
        </div>
        <div class="col-md-6 mb-3">
            <div class="card text-center dashboard-card bg-scheduled">
                <div class="card-body">
                    <h5 class="card-title">Scheduled Streams</h5>
                    <p class="display-4" id="streamsScheduled">-</p>
                </div>
            </div>
        </div>
    </div>
    <h4 class="mb-3">Storage</h4>
    <div class="row mb-4">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <h6 class="card-title mb-3">Storage Usage</h6>
                    <div class="d-flex align-items-center mb-2">
                        <div class="progress flex-grow-1 me-3" style="height: 20px;">
                            <div id="storageProgress" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
                        </div>
                        <div class="text-nowrap">
                            <span id="storageUsed">0 B</span> of <span id="storageTotal">0 B</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <h4 class="mb-3">Server Metrics</h4>
    <div class="row">
        <div class="col-md-6 mb-3">
            <div class="card text-center dashboard-card bg-cpu">
                <div class="card-body">
                    <h6 class="card-title">CPU Usage</h6>
                    <p class="fs-4" id="cpuUsage">-</p>
                </div>
            </div>
        </div>
        <div class="col-md-6 mb-3">
            <div class="card text-center dashboard-card bg-memory">
                <div class="card-body">
                    <h6 class="card-title">Memory Usage</h6>
                    <p class="fs-4" id="memoryUsage">-</p>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6 mb-3">
            <div class="card text-center dashboard-card bg-upload">
                <div class="card-body">
                    <h6 class="card-title">Upload Rate</h6>
                    <p class="fs-4" id="uploadRate">-</p>
                </div>
            </div>
        </div>
        <div class="col-md-6 mb-3">
            <div class="card text-center dashboard-card bg-download">
                <div class="card-body">
                    <h6 class="card-title">Download Rate</h6>
                    <p class="fs-4" id="downloadRate">-</p>
                </div>
            </div>
        </div>
    </div>
</div>
<footer class="text-center text-muted py-3" id="footer"></footer>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
const sinceYear = 2025;
const nowYear = new Date().getFullYear();
let yearStr = sinceYear === nowYear ? `${sinceYear}` : `${sinceYear} - ${nowYear}`;

fetch('/api/version')
  .then(res => res.json())
  .then(data => {
    let versionStr = '';
    if (data.version && data.commit) {
      versionStr = ` | <span class='text-secondary'>Version: ${data.version} (<code>${data.commit.slice(0,7)}</code>)</span>`;
    }
    document.getElementById('footer').innerHTML = `&copy; ${yearStr} Yuk Live! By PT Jejaring Internet Bersama${versionStr}`;
    const script = document.createElement('script');
    script.src = `/static/js/dashboard.js?v=${data.version ? data.version : '0.4.3'}`;
    document.body.appendChild(script);
  })
  .catch(() => {
    document.getElementById('footer').innerHTML = `&copy; ${yearStr} Yuk Live! By PT Jejaring Internet Bersama`;
    const script = document.createElement('script');
    script.src = `/static/js/dashboard.js?v=0.4.3`;
    document.body.appendChild(script);
  });

// Show User Management menu if user is admin
$(function() {
    const token = localStorage.getItem('jwt_token');
    if (token) {
        // Decode JWT to check is_admin (assume payload is base64 encoded JSON)
        try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            if (!payload.is_admin) {
                $('#menuUserMgmt').addClass('d-none');
            }
        } catch (e) {}
    } else {
        $('#menuUserMgmt').addClass('d-none');
    }
});
</script>
