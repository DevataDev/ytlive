<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YukLive! Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header class="sticky-top bg-white border-bottom shadow-sm mb-4">
    <nav class="navbar navbar-expand-lg bg-white">
        <div class="container-fluid">
            <span class="fw-bold fs-4 me-3">YukLive!</span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a href="/dashboard" class="nav-link" id="menuDashboard">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a href="/stream" class="nav-link" id="menuStream">Stream</a>
                    </li>
                </ul>
                <button id="logoutBtn" class="btn btn-outline-secondary ms-lg-2">Logout</button>
            </div>
        </div>
    </nav>
</header>
<div class="container dashboard-container">
    <h2 class="mb-4">Dashboard</h2>
    <div class="row mb-4">
        <div class="col-md-6 mb-3">
            <div class="card text-center dashboard-card bg-live">
                <div class="card-body">
                    <h5 class="card-title">Live Streams Started</h5>
                    <p class="display-4" id="streamsStarted">-</p>
                </div>
            </div>
        </div>
        <div class="col-md-6 mb-3">
            <div class="card text-center dashboard-card bg-scheduled">
                <div class="card-body">
                    <h5 class="card-title">Scheduled Streams</h5>
                    <p class="display-4" id="streamsScheduled">-</p>
                </div>
            </div>
        </div>
    </div>
    <h4 class="mb-3">Server Metrics</h4>
    <div class="row">
        <div class="col-md-6 mb-3">
            <div class="card text-center dashboard-card bg-cpu">
                <div class="card-body">
                    <h6 class="card-title">CPU Usage</h6>
                    <p class="fs-4" id="cpuUsage">-</p>
                </div>
            </div>
        </div>
        <div class="col-md-6 mb-3">
            <div class="card text-center dashboard-card bg-memory">
                <div class="card-body">
                    <h6 class="card-title">Memory Usage</h6>
                    <p class="fs-4" id="memoryUsage">-</p>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6 mb-3">
            <div class="card text-center dashboard-card bg-upload">
                <div class="card-body">
                    <h6 class="card-title">Upload Rate</h6>
                    <p class="fs-4" id="uploadRate">-</p>
                </div>
            </div>
        </div>
        <div class="col-md-6 mb-3">
            <div class="card text-center dashboard-card bg-download">
                <div class="card-body">
                    <h6 class="card-title">Download Rate</h6>
                    <p class="fs-4" id="downloadRate">-</p>
                </div>
            </div>
        </div>
    </div>
</div>
<footer class="text-center text-muted py-3" id="footer"></footer>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="/static/js/dashboard.js"></script>
<script>
const sinceYear = 2025;
const nowYear = new Date().getFullYear();
let yearStr = sinceYear === nowYear ? `${sinceYear}` : `${sinceYear} - ${nowYear}`;
document.getElementById('footer').innerHTML = `&copy; ${yearStr} Yuk Live! By PT Jejaring Internet Bersama`;
</script>
</body>
</html>
